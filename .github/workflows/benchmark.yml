name: 'Benchmarks'

on: [pull_request, push]

permissions:
  contents: read

jobs:
  shard:
    name: 'shard ${{ matrix.shard }}'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          show-progress: false
      - name: fetch release tags from ljharb/qs, since forks may not have them
        run: git fetch --no-recurse-submodules --tags https://github.com/ljharb/qs.git
      - uses: ljharb/actions/node/install@main
        name: 'nvm install lts/* && npm install'
        with:
          node-version: 'lts/*'
      - run: npm run benchmark -- --max-time 0.01 --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  benchmark:
    needs: [shard]
    runs-on: ubuntu-latest
    steps:
      - run: true
