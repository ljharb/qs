name: 'Benchmarks'

on: [pull_request, push]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          show-progress: false
      - name: fetch release tags from ljharb/qs, since forks may not have them
        run: git fetch --no-recurse-submodules --tags https://github.com/ljharb/qs.git
      - uses: ljharb/actions/node/install@main
        name: 'nvm install lts/* && npm install'
        with:
          node-version: 'lts/*'
      - run: npm run benchmark -- --max-time 0.01
